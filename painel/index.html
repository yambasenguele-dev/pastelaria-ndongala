<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | Ndongala Sabor e Arte</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    :root {
      --c1:#5D3A1A; --c2:#8B5A2B; --dourado:#C9A227; --creme:#F5E6C8;
      --sombra:0 4px 20px rgba(93,58,26,.12);
    }
    *{box-sizing:border-box}
    body{background:#F7F2EA;margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#2C1A0E}
    .hdr{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:.9rem 1.4rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sombra)}
    .brand{display:flex;align-items:center;gap:.7rem}
    .brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--dourado);object-fit:cover}
    .brand h1{font-size:1.1rem;margin:0;color:var(--creme)}
    .brand span{font-size:.72rem;opacity:.85;display:block}
    .btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:.4rem 1rem;border-radius:50px;font-size:.88rem;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.1rem 3rem}
    .tabs{display:flex;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
    .tab{background:#fff;border:2px solid transparent;padding:.55rem 1.2rem;border-radius:50px;font-weight:600;cursor:pointer;font-size:.9rem;color:var(--c1);box-shadow:var(--sombra)}
    .tab.activo{background:var(--c1);color:var(--creme)}
    .sec{display:none}.sec.activa{display:block}
    .topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.3rem}
    .topo h2{margin:0;font-size:1.45rem;color:var(--c1)}
    .topo p{margin:.15rem 0 0;color:#666;font-size:.9rem}
    .btn{border:none;padding:.5rem 1.1rem;border-radius:50px;font-weight:600;cursor:pointer;font-size:.88rem}
    .btn-p{background:var(--c1);color:var(--creme)}.btn-p:hover{background:var(--c2)}
    .btn-s{background:#fff;color:var(--c1);border:1px solid #ddd}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.9rem;margin-bottom:1.4rem}
    .stat{background:#fff;border-radius:12px;padding:1rem;text-align:center;box-shadow:var(--sombra)}
    .stat .n{font-size:1.6rem;font-weight:700;color:var(--c1)}.stat .l{font-size:.78rem;color:#777}
    .lista{display:flex;flex-direction:column;gap:.9rem}
    .card{background:#fff;border-radius:14px;box-shadow:var(--sombra);overflow:hidden;border:1px solid rgba(93,58,26,.08)}
    .card-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;padding:.9rem 1.2rem;background:#FBF7F0;border-bottom:1px solid #f0e6d6}
    .card-body{padding:1rem 1.2rem}
    .badge{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase}
    .b-pendente{background:#FFF3CD;color:#856404}.b-confirmado{background:#D1ECF1;color:#0C5460}
    .b-preparando{background:#E2D5F1;color:#5A2D82}.b-pronto{background:#D4EDDA;color:#155724}
    .b-entregue{background:#C3E6CB;color:#0B3D0B}.b-cancelado{background:#F8D7DA;color:#721C24}
    .acoes{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
    .acoes button{border:none;padding:.35rem .75rem;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer}
    .bc{background:#D1ECF1;color:#0C5460}.bp{background:#E2D5F1;color:#5A2D82}
    .br{background:#D4EDDA;color:#155724}.be{background:#C3E6CB;color:#0B3D0B}.bx{background:#F8D7DA;color:#721C24}
    .vazio,.load{text-align:center;padding:3rem 1.2rem;background:#fff;border-radius:14px;box-shadow:var(--sombra);color:#888}
    .load{color:var(--c1);font-weight:500}
    .aviso{background:#FFEBEE;border:1px solid #EF9A9A;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.2rem;color:#B71C1C;font-size:.9rem}
    .ok-msg{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.2rem;color:#1B5E20;font-size:.9rem}
    .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .prod-card{background:#fff;border-radius:14px;box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column}
    .prod-card img{width:100%;height:160px;object-fit:cover;background:#eee}
    .prod-card .info{padding:1rem;flex:1;display:flex;flex-direction:column}
    .prod-card h3{margin:0 0 .3rem;font-size:1rem;color:var(--c1)}
    .prod-card .desc{font-size:.82rem;color:#666;flex:1;margin-bottom:.5rem}
    .prod-card .preco{font-weight:700;color:var(--c2);font-size:1.05rem}
    .prod-card .acoes-prod{display:flex;gap:.4rem;margin-top:.7rem}
    .prod-card .acoes-prod button{flex:1;border:none;padding:.4rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer}
    .btn-edit{background:#E3F2FD;color:#1565C0}.btn-del{background:#FFEBEE;color:#C62828}
    .tag-off{background:#eee;color:#888;font-size:.7rem;padding:.15rem .5rem;border-radius:10px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal-bg.escondido{display:none}
    .modal{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
    .modal h3{margin:0 0 1rem;color:var(--c1)}
    .campo{margin-bottom:.9rem}
    .campo label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.3rem;color:#444}
    .campo input,.campo textarea{width:100%;padding:.55rem .7rem;border:1px solid #ddd;border-radius:8px;font-size:.92rem;font-family:inherit}
    .campo textarea{min-height:70px;resize:vertical}
    .check-row{display:flex;gap:1.2rem;align-items:center}
    .check-row label{font-weight:500;display:flex;align-items:center;gap:.35rem;cursor:pointer}
    .modal-btns{display:flex;gap:.6rem;margin-top:1.2rem}
    .modal-btns button{flex:1}
  </style>
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <img src="../imagens/logo.png" alt="Logo">
      <div><h1>Painel Admin</h1><span>Ndongala Sabor e Arte</span></div>
    </div>
    <a href="../index.html" class="btn-back">← Site</a>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab activo" data-tab="pedidos" onclick="mudarTab('pedidos')">Pedidos</button>
      <button class="tab" data-tab="produtos" onclick="mudarTab('produtos')">Produtos</button>
    </div>
    <div id="msgArea"></div>

    <section id="sec-pedidos" class="sec activa">
      <div class="topo">
        <div><h2>Pedidos</h2><p>Pedidos feitos pelo site</p></div>
        <button class="btn btn-p" onclick="carregarPedidos()">↻ Actualizar</button>
      </div>
      <div class="stats" id="statsBar" style="display:none">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total</div></div>
        <div class="stat"><div class="n" id="stPend">0</div><div class="l">Pendentes</div></div>
        <div class="stat"><div class="n" id="stPrep">0</div><div class="l">A preparar</div></div>
        <div class="stat"><div class="n" id="stEnt">0</div><div class="l">Entregues</div></div>
      </div>
      <div id="listaPedidos" class="lista"><div class="load">A carregar...</div></div>
    </section>

    <section id="sec-produtos" class="sec">
      <div class="topo">
        <div><h2>Produtos</h2><p>Adicionar, editar ou remover produtos</p></div>
        <button class="btn btn-p" onclick="abrirModalProduto()">+ Novo produto</button>
      </div>
      <div id="listaProdutos" class="prod-grid"><div class="load">A carregar...</div></div>
    </section>
  </div>

  <div class="modal-bg escondido" id="modalProduto">
    <div class="modal">
      <h3 id="modalTitulo">Novo produto</h3>
      <input type="hidden" id="prodId">
      <div class="campo"><label>Nome *</label><input type="text" id="prodNome" required></div>
      <div class="campo"><label>Descrição</label><textarea id="prodDesc"></textarea></div>
      <div class="campo"><label>Preço (Kz) *</label><input type="number" id="prodPreco" min="0" step="100" required></div>
      <div class="campo"><label>URL da imagem</label><input type="text" id="prodImg" placeholder="imagens/produtos/bolo.jpg ou https://..."></div>
      <div class="campo check-row">
        <label><input type="checkbox" id="prodDestaque"> Destaque</label>
        <label><input type="checkbox" id="prodActivo" checked> Activo</label>
      </div>
      <div class="modal-btns">
        <button class="btn btn-s" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-p" onclick="guardarProduto()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    function fmt(v){return Number(v).toLocaleString('pt-AO')+' Kz'}
    function fmtData(iso){
      if(!iso)return '';
      return new Date(iso).toLocaleString('pt-AO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    function msg(texto, tipo){
      document.getElementById('msgArea').innerHTML = '<div class="'+(tipo==='erro'?'aviso':'ok-msg')+'">'+texto+'</div>';
      setTimeout(function(){document.getElementById('msgArea').innerHTML=''},5000);
    }
    function mudarTab(nome){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('activo',t.dataset.tab===nome)});
      document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('activa',s.id==='sec-'+nome)});
      if(nome==='produtos') carregarProdutos();
      if(nome==='pedidos') carregarPedidos();
    }

    async function carregarPedidos(){
      var el=document.getElementById('listaPedidos');
      el.innerHTML='<div class="load">A carregar...</div>';
      if(typeof iniciarSupabase!=='function'){el.innerHTML='<div class="vazio">supabase.js nao carregou</div>';return}
      iniciarSupabase();
      var r=await buscarPedidos();
      if(r.erro){el.innerHTML='<div class="vazio">Erro: '+r.erro+'</div>';return}
      var pedidos=r.dados||[];
      if(!pedidos.length){
        document.getElementById('statsBar').style.display='none';
        el.innerHTML='<div class="vazio">Ainda nao ha pedidos.</div>';return;
      }
      document.getElementById('stTotal').textContent=pedidos.length;
      document.getElementById('stPend').textContent=pedidos.filter(function(p){return p.status==='pendente'}).length;
      document.getElementById('stPrep').textContent=pedidos.filter(function(p){return p.status==='preparando'||p.status==='confirmado'}).length;
      document.getElementById('stEnt').textContent=pedidos.filter(function(p){return p.status==='entregue'}).length;
      document.getElementById('statsBar').style.display='grid';
      var labels={pendente:'Pendente',confirmado:'Confirmado',preparando:'A preparar',pronto:'Pronto',entregue:'Entregue',cancelado:'Cancelado'};
      el.innerHTML=pedidos.map(function(p){
        var itens=(p.itens_pedido||[]).map(function(i){return '• '+i.nome_produto+' × '+i.quantidade+' — '+fmt(i.total)}).join('<br>');
        return '<article class="card"><div class="card-top"><div><strong style="color:var(--c1)">'+p.numero_pedido+'</strong><br><small style="color:#888">'+fmtData(p.criado_em)+'</small></div><span class="badge b-'+p.status+'">'+(labels[p.status]||p.status)+'</span></div><div class="card-body"><div style="margin-bottom:.6rem;line-height:1.5"><strong>'+p.nome_cliente+'</strong> · '+p.telefone+'<br>'+(p.localizacao?'📍 '+p.localizacao+'<br>':'')+(p.tipo_entrega==='entrega'?'🛵 Entrega':'🏪 Retirada')+(p.endereco?' · '+p.endereco:'')+'</div><div style="background:#fafafa;padding:.6rem .9rem;border-radius:8px;font-size:.86rem;margin-bottom:.6rem">'+itens+'</div><div style="font-weight:700;color:var(--c2);margin-bottom:.5rem">Total: '+fmt(p.total)+'</div>'+(p.observacoes?'<div style="font-size:.84rem;color:#666;font-style:italic;margin-bottom:.5rem">Obs: '+p.observacoes+'</div>':'')+'<div class="acoes"><button class="bc" onclick="setStatus(\''+p.id+'\',\'confirmado\')">Confirmado</button><button class="bp" onclick="setStatus(\''+p.id+'\',\'preparando\')">A preparar</button><button class="br" onclick="setStatus(\''+p.id+'\',\'pronto\')">Pronto</button><button class="be" onclick="setStatus(\''+p.id+'\',\'entregue\')">Entregue</button><button class="bx" onclick="setStatus(\''+p.id+'\',\'cancelado\')">Cancelar</button></div></div></article>';
      }).join('');
    }
    async function setStatus(id,st){
      var ok=await actualizarStatusPedido(id,st);
      if(ok){msg('Estado actualizado');carregarPedidos()}
      else msg('Erro ao actualizar','erro');
    }

    async function carregarProdutos(){
      var el=document.getElementById('listaProdutos');
      el.innerHTML='<div class="load">A carregar...</div>';
      iniciarSupabase();
      var r=await buscarProdutosDB();
      if(r.erro){el.innerHTML='<div class="vazio">Erro: '+r.erro+'<br><small>Execute o SQL de politicas de produtos.</small></div>';return}
      var prods=r.dados||[];
      if(!prods.length){el.innerHTML='<div class="vazio">Nenhum produto. Clique em "+ Novo produto".</div>';return}
      el.innerHTML=prods.map(function(p){
        return '<div class="prod-card"><img src="'+(p.imagem_url||'../imagens/logo.png')+'" alt="'+p.nome+'" onerror="this.src=\'../imagens/logo.png\'"><div class="info"><h3>'+p.nome+' '+(!p.activo?'<span class="tag-off">Inactivo</span>':'')+'</h3><div class="desc">'+(p.descricao||'')+'</div><div class="preco">'+fmt(p.preco)+'</div><div class="acoes-prod"><button class="btn-edit" onclick="editarProdutoObj(\''+p.id+'\')">Editar</button><button class="btn-del" onclick="apagarProduto(\''+p.id+'\',\''+(p.nome||'').replace(/'/g,"\\'")+'\')">Eliminar</button></div></div></div>';
      }).join('');
      window._prodsCache=prods;
    }
    function editarProdutoObj(id){
      var p=(window._prodsCache||[]).find(function(x){return x.id===id});
      if(!p)return;
      document.getElementById('modalTitulo').textContent='Editar produto';
      document.getElementById('prodId').value=p.id;
      document.getElementById('prodNome').value=p.nome||'';
      document.getElementById('prodDesc').value=p.descricao||'';
      document.getElementById('prodPreco').value=p.preco||'';
      document.getElementById('prodImg').value=p.imagem_url||'';
      document.getElementById('prodDestaque').checked=!!p.destaque;
      document.getElementById('prodActivo').checked=p.activo!==false;
      document.getElementById('modalProduto').classList.remove('escondido');
    }
    function abrirModalProduto(){
      document.getElementById('modalTitulo').textContent='Novo produto';
      document.getElementById('prodId').value='';
      document.getElementById('prodNome').value='';
      document.getElementById('prodDesc').value='';
      document.getElementById('prodPreco').value='';
      document.getElementById('prodImg').value='';
      document.getElementById('prodDestaque').checked=false;
      document.getElementById('prodActivo').checked=true;
      document.getElementById('modalProduto').classList.remove('escondido');
    }
    function fecharModal(){document.getElementById('modalProduto').classList.add('escondido')}
    async function guardarProduto(){
      var id=document.getElementById('prodId').value;
      var dados={
        nome:document.getElementById('prodNome').value.trim(),
        descricao:document.getElementById('prodDesc').value.trim(),
        preco:document.getElementById('prodPreco').value,
        imagem_url:document.getElementById('prodImg').value.trim(),
        destaque:document.getElementById('prodDestaque').checked,
        activo:document.getElementById('prodActivo').checked
      };
      if(!dados.nome||!dados.preco){alert('Nome e preco sao obrigatorios');return}
      var r=id?await actualizarProduto(id,dados):await criarProduto(dados);
      if(r.ok){msg(id?'Produto actualizado':'Produto criado');fecharModal();carregarProdutos()}
      else msg('Erro: '+(r.erro||'desconhecido'),'erro');
    }
    async function apagarProduto(id,nome){
      if(!confirm('Eliminar "'+nome+'"?'))return;
      var r=await eliminarProduto(id);
      if(r.ok){msg('Produto eliminado');carregarProdutos()}
      else msg('Erro: '+(r.erro||''),'erro');
    }

    document.addEventListener('DOMContentLoaded',function(){
      iniciarSupabase();
      carregarPedidos();
    });
  </script>
</body>
</html>
